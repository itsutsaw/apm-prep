<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google APM Interview Prep</title>
  <meta name="description" content="Personal day-by-day prep for the Google APM round-one interview.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EPM%3C/text%3E%3C/svg%3E">
  <script>
    // Apply saved theme before paint to avoid a flash.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('apmPrep.v1') || '{}').settings.theme; } catch (e) {}
      if (!t) { t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/dashboard"><span class="brand-mark" aria-hidden="true">PM</span> APM Prep</a>
    <span id="topCountdown" class="top-countdown" aria-live="off"></span>
    <button id="themeBtn" class="icon-btn" aria-label="Switch to dark mode">
      <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
      <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Main">
      <ul id="navList" class="nav-list"></ul>
    </nav>
    <div id="scrim" class="scrim" hidden></div>
    <main id="main" class="main" tabindex="-1">
      <noscript><p class="card">This site needs JavaScript enabled.</p></noscript>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
